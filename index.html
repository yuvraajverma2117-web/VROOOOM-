<!DOCTYPE html>
<html>
<head>
<style>
body { margin:0; overflow:hidden; background:#000; }
canvas { display:block; }
</style>
</head>
<body>
<canvas id="g"></canvas>
<script>
var c = document.getElementById("g");
var ctx = c.getContext("2d");

var w = c.width = window.innerWidth;
var h = c.height = window.innerHeight;
var x=0, d=0, s=0, sc=0, sh=0;
var k = {};
var r = [];
var a = null;
var sy = null;

for(var i=15; i<600; i+=20){
 r.push({z: i*200, x: (Math.random()-0.5)*1.5});
}

function init(){
  if(a) return;
  var AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
   a = new AC();
  sy = a.createOscillator();
  var g = a.createGain();
  sy.type = "sawtooth";
  sy.frequency.setValueAtTime(40, a.currentTime);
    g.gain.setValueAtTime(0.04, a.currentTime);
  sy.connect(g);
  g.connect(a.destination);
  sy.start();
}

function sfx(){
    if(!a) return;
  var o = a.createOscillator();
  var g = a.createGain();
   o.type = "sine";
  o.frequency.setValueAtTime(300, a.currentTime);
  o.frequency.exponentialRampToValueAtTime(1200, a.currentTime+0.4);
  g.gain.setValueAtTime(0.15, a.currentTime);
   g.gain.linearRampToValueAtTime(0.01, a.currentTime+0.4);
  o.connect(g);
  g.connect(a.destination);
  o.start();
  o.stop(a.currentTime+0.4);
}

window.onkeydown = function(e){
 k[e.code] = 1;
  init();
};
window.onkeyup = function(e){
  k[e.code] = 0;
};

window.onresize = function(){
  w = c.width = window.innerWidth;
   h = c.height = window.innerHeight;
};

function frame(){
  ctx.fillStyle = "#010408";
  ctx.fillRect(0,0,w,h);

  var ox = 0, oy = 0;
    if(sh > 0){
    ox = (Math.random()-0.5)*sh;
    oy = (Math.random()-0.5)*sh;
    sh *= 0.9;
  }

  if(k["ArrowLeft"]||k["KeyA"]) x -= 0.05*(s/100);
    if(k["ArrowRight"]||k["KeyD"]) x += 0.05*(s/100);
  if(k["ArrowUp"]||k["KeyW"]) s = Math.min(s+3, 200);
  else s = Math.max(s-3, 0);

  d += s;
  sc += Math.floor(s/10);
  if(sy) sy.frequency.setValueAtTime(30+s*0.7, a.currentTime);

   var start = Math.floor(d/200);
  for(var i=start+35; i>start; i--){
    var z1 = i*200 - d;
    var z2 = (i-1)*200 - d;
      if(z2 <= 0) continue;

    var sc1 = 300/z1;
    var sc2 = 300/z2;
    var x1 = w/2 + (-x)*sc1*w + ox;
    var y1 = h/2 + 1600*sc1 + oy;
    var x2 = w/2 + (-x)*sc2*w + ox;
    var y2 = h/2 + 1600*sc2 + oy;
    var w1 = w*sc1;
     var w2 = w*sc2;

    ctx.fillStyle = (i%2===0) ? "#0a0d14" : "#121724";
    ctx.beginPath();
     ctx.moveTo(x1-w1, y1);
    ctx.lineTo(x1+w1, y1);
    ctx.lineTo(x2+w2, y2);
    ctx.lineTo(x2-w2, y2);
     ctx.fill();

    ctx.fillStyle = (i%2===0) ? "#00ffff" : "#003333";
    ctx.fillRect(x1-w1-2, y1, 4*sc1, y2-y1+2);
     ctx.fillRect(x1+w1-2, y1, 4*sc1, y2-y1+2);
  }

  for(var j=0; j<r.length; j++){
    var g = r[j];
     var rz = g.z - d;
    if(rz > 0 && rz < 7000){
      var scale = 300/rz;
      var rx = w/2 + (g.x - x)*scale*w + ox;
      var ry = h/2 + 1000*scale + oy;
       var rad = 350*scale;

      ctx.strokeStyle = "#00ff66";
      ctx.lineWidth = Math.max(2, 8*scale);
      ctx.shadowBlur = 20*scale;
      ctx.shadowColor = "#00ff66";
      ctx.beginPath();
      ctx.arc(rx, ry, rad, 0, Math.PI*2);
        ctx.stroke();
      ctx.shadowBlur = 0;

      if(rz < 250 && rz > 0 && Math.abs(g.x - x) < 0.4){
        sh = 30;
         sc += 2500;
        s = 300;
        sfx();
        g.z = -99999;
      }
    }
  }

  ctx.strokeStyle = "#00d2ff";
  ctx.lineWidth = 3;
  ctx.beginPath();
    ctx.moveTo(w/2-25, h-40);
  ctx.lineTo(w/2+25, h-40);
  ctx.moveTo(w/2, h-65);
  ctx.lineTo(w/2, h-15);
  ctx.stroke();

  ctx.fillStyle = "#00ffcc";
   ctx.font = "bold 22px monospace";
  ctx.fillText("SCORE: " + sc, 30, 45);
  ctx.fillText("VELOCITY: " + Math.floor(s) + " KM/H", 30, 75);

  if(s === 0){
    ctx.fillText("HOLD UP OR W TO BOOST", w/2-130, h/2-50);
  }

  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
